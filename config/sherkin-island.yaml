# Sherkin Island / Baltimore / Cape Clear network, live Copernicus Marine data.
# Run with: pixi run snakemake --snakefile workflow/Snakefile --configfile config/sherkin-island.yaml --cores 1

networks: ["sherkin-island"]

time:
  start: "2024-01-01"
  end: "2024-03-30" # exclusive

sample:
  densify_km: 1.5

harmonise:
  target_step: "1h"

bbox:
  # Wider than the other example networks on purpose: Sherkin Island/Baltimore/Cape Clear sit in a
  # tight cluster of channels only 1-3 km wide, which the ~9km-resolution CMEMS current/wave grids
  # mostly land-mask. A bigger margin pulls in open-water cells further offshore so harmonise's
  # bilinear interpolation has valid neighbours to work with, instead of interpolating from a
  # handful of mostly-masked cells right at the coastline.
  margin_deg: 0.5

cache_dir: "resources/automatic/.cache"

sources:
  current: { provider: cmems, dataset_id: null, variables: [uo, vo] }
  wave: { provider: cmems, dataset_id: null, variables: [VHM0, VMDR, VTM10] }
  wind: { provider: cmems, dataset_id: null, variables: [eastward_wind, northward_wind] }
