# Rosslare (IE) - Roscoff (FR) route, live Copernicus Marine data.
# Run with: pixi run snakemake --snakefile workflow/Snakefile --configfile config/rosslare-roscoff.yaml --cores 1

networks: ["rosslare-roscoff"]

time:
  start: "2024-01-01"
  end: "2024-12-31" # exclusive -- one week

sample:
  densify_km: 1.5

harmonise:
  target_step: "1h"

bbox:
  margin_deg: 0.1

cache_dir: "resources/automatic/.cache"

sources:
  current: { provider: cmems, dataset_id: null, variables: [uo, vo] }
  wave: { provider: cmems, dataset_id: null, variables: [VHM0, VMDR, VTM10] }
  wind: { provider: cmems, dataset_id: null, variables: [eastward_wind, northward_wind] }
