# A minimal example configuration -- builds the resources/user/dublin-bay example from live
# Copernicus Marine data. Needs CMEMS_USERNAME/CMEMS_PASSWORD in the environment (see
# config/README.md). See docs/contract.md for the bundle this produces.

networks: ["dublin-bay"] # subdirs of resources/user/ to build; omit/empty = discover all

time:
  start: "2024-01-01"
  end: "2024-01-08" # exclusive -- this window is 7 days, hourly

sample:
  densify_km: 1.5 # target vertex spacing after densification (contract recommends ~1-2 km)

harmonise:
  target_step: "1h"

bbox:
  # Dublin Bay is a small, semi-enclosed bay -- a narrow margin only reaches a handful of the
  # ~9km-resolution CMEMS current/wave grid cells, most of which the model land-masks (checked
  # directly: with margin_deg 0.1, current/wave were 100% NaN on every route -- see the
  # sherkin-island network for the same issue and fix). A wider margin pulls in open-water cells
  # further offshore so harmonise's bilinear interpolation has valid neighbours to work with.
  margin_deg: 0.5 # degrees added around the network's own extent before fetching

cache_dir: "resources/automatic/.cache"

sources:
  current: { provider: cmems, dataset_id: null, variables: [uo, vo] }
  wave: { provider: cmems, dataset_id: null, variables: [VHM0, VMDR, VTM10] }
  wind: { provider: cmems, dataset_id: null, variables: [eastward_wind, northward_wind] }
