[workspace]
name = "water-routefinder"
authors = ["See AUTHORS file"]
description = "Snakemake workflow that downloads, harmonises and samples met-ocean conditions onto vessel-route geometry, emitting the conditions bundle water-path consumes."
license = "Apache-2.0"
readme = "README.md"
channels = ["conda-forge", "bioconda"]
platforms = ["win-64", "linux-64"]

# One environment for v1: dev tools (snakemake, pytest, ruff, jsonschema) and runtime libs
# (xarray, pyproj, ...) together. Splitting into a minimal per-rule "module" env (conda-isolated
# via `snakemake --use-conda`) is a follow-up for if/when a rule needs a conflicting dependency set
# — see docs/roadmap.md.
[dependencies]
python = ">=3.11,<3.13"
snakemake-minimal = ">=8"
pytest = ">=8"
ruff = ">=0.6"
jsonschema = ">=4.20"
pyyaml = ">=6"
numpy = ">=1.26"
pandas = ">=2.1"
xarray = ">=2024.1"
pyarrow = ">=15"
pyproj = ">=3.6"
scipy = ">=1.11"
pydantic = ">=2.6"
netcdf4 = ">=1.6"
matplotlib = ">=3.8"
python-dotenv = ">=1.0"
geopandas = ">=1.0"
pyogrio = ">=0.9"
mkdocs-material = ">=9.5"

# Not (reliably) on conda-forge / simplest kept as pip installs, including the package itself
# (editable, so `import water_routefinder` resolves to src/water_routefinder without a build step).
[pypi-dependencies]
copernicusmarine = ">=1.3"
cdsapi = ">=0.7"
water-routefinder = { path = ".", editable = true }

[tasks]
# Unit + input-format tests only — offline, fast, run on every commit.
test-unit = "pytest tests/unit tests/test_input_format.py -q"
# Everything except tests that hit live CMEMS/ERA5.
test = "pytest -q -m 'not integration'"
# Tests that need real CMEMS_USERNAME/_PASSWORD or CDSAPI_KEY.
test-integration-live = "pytest -q -m integration"
lint = "ruff check ."
# Build the example network end to end (needs CMEMS_USERNAME/CMEMS_PASSWORD -- see config/README.md).
run-demo = "snakemake --snakefile workflow/Snakefile --configfile config/config.yaml --cores 1"
dry-run = "snakemake --snakefile workflow/Snakefile --configfile config/config.yaml --cores 1 -n"
# Docs site (docs/, mkdocs.yml) -- published via .github/workflows/docs.yml on push to main.
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"
