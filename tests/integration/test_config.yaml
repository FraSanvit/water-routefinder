# Pinned config for the end-to-end workflow test (tests/integration/test_workflow.py) and the
# drift guard against tests/integration/expected/. Deliberately a separate file from
# config/config.yaml so that file can evolve (e.g. to add a second example network) without
# silently changing what this test builds.
#
# Uses the live cmems provider (the workflow supports only cmems/era5 for now -- no offline mock)
# so this test needs CMEMS_USERNAME/CMEMS_PASSWORD and is credential-gated (@pytest.mark.integration).

networks: ["dublin-bay"]

time:
  start: "2024-01-01"
  end: "2024-01-08"

sample:
  densify_km: 1.5

harmonise:
  target_step: "1h"

bbox:
  margin_deg: 0.1

cache_dir: "resources/automatic/.cache"

sources:
  current: { provider: cmems, dataset_id: null, variables: [uo, vo] }
  wave: { provider: cmems, dataset_id: null, variables: [VHM0, VMDR, VTM10] }
  wind: { provider: cmems, dataset_id: null, variables: [eastward_wind, northward_wind] }
